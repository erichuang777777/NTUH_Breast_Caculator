[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["data/api/*.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  # Legacy NCCN module is removed until it is rebuilt as a separate plugin.
  from = "/nccn_viewer.html"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/NCCN_Breast_KG/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
