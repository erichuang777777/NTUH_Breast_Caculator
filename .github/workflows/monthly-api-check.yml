name: Monthly API Price / Indication Check

on:
  schedule:
    # 23rd day of each month at 15:15 UTC = 23:15 Asia/Taipei
    - cron: "15 15 23 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-api-check
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Dry-run official price refresh
        run: python update_official_prices.py --dry-run

      - name: API and semantic smoke checks
        run: python tools/check_api.py
