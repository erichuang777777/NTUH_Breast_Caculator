name: Monthly Coverage Rule Check

on:
  schedule:
    # 27th day of each month at 15:25 UTC = 23:25 Asia/Taipei
    - cron: "25 15 27 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monthly-coverage-check
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check official coverage PDF drift
        run: python tools/check_coverage_pdf.py --baseline data/validation/coverage_pdf_snapshot.json --strict

      - name: API and semantic smoke checks
        run: python tools/check_api.py
